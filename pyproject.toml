[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meshharmonics"
version = "0.1.0"
description = "Spectral geometry on triangle meshes: cotangent Laplacians, eigensolvers, spherical harmonics, heat kernel signatures and geodesics in pure Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "meshharmonics contributors" }]
keywords = ["mesh", "geometry processing", "spectral geometry", "laplacian", "spherical harmonics",
            "heat kernel signature", "geodesics", "geometric deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meshharmonics = "meshharmonics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
